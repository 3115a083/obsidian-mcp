worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=perip:1m rate=20r/s;
  server {
    listen 8080;
    client_max_body_size 256k;
    limit_req zone=perip burst=40 nodelay;
    limit_req_status 429;
    # Docker DNS re-resolves the app after a container update.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_backend http://app:8000;
    location / {
      proxy_pass $app_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
